services:
  - type: web
    name: queueless-api
    runtime: docker
    repo: https://github.com/rajsirajsi51-11/queueless
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEV_AUTH_ENABLED
        value: false
      - key: CORS_ORIGINS
        value: https://queueless-brown.vercel.app
      - key: FIREBASE_PROJECT_ID
        value: queueless-live-20261028
